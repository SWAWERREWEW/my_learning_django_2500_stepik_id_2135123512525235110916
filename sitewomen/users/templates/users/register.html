<!-- sitewomen\users\templates\users\register.html -->
{% extends 'base.html' %}

{% block content %}
<h1> 💲🏠 Регистрация </h1>
<form method="POST">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}"/>
    <div> {{ form.non_field_errors }} </div>
    {% for f in form %}
        <p style="color: darkgreen;">
            ⚠ {{ f.label }} ⚠ <br>
            {{ f }}
            <div> {{ f.errors }} </div>
        </p>
    {% endfor %}
    <p> <button type="submit"> 🏠💲Регистрация💲🏠 </button> </p>
</form>
{% endblock %}
