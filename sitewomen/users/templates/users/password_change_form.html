<!-- sitewomen/users/templates/users/password_change_form.html -->
{% extends 'base.html' %}

{% block content %}
<h1>♻💾 Изменение пароля 🗝🛠</h1>

<form method="post">
    {% csrf_token %}
    <div class="form-error">{{ form.non_field_errors }}</div>
    {% for f in form %}
        <p style="color: darkgreen;">
            <label class="form-label" for="{{ f.id_for_label }}">{{f.label}}: </label>{{ f }}
        </p>
        <div class="form-error" style="color: red;">{{ f.errors }}</div>
    {% endfor %}
    <p><button type="submit">♻💬 Сменить пароль 🛠🧠</button></p>
</form>

{% endblock %}
